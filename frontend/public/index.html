<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0f172a" />
        <meta name="description" content="tryHimandsee ministries - Encouraging people to follow Christ and seek encounters with Him. Serving the poor and underserved communities of Richmond and Henrico." />
        <meta name="keywords" content="tryHimandsee, Christian ministry, Richmond Virginia, Henrico, outreach, food pantry, hygiene kits, donations, prayer, miracle run" />
        <meta name="author" content="tryHimandsee ministries" />

        <!-- Open Graph / social sharing -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="tryHimandsee ministries" />
        <meta property="og:title" content="tryHimandsee ministries" />
        <meta property="og:description" content="Encouraging people to follow Christ and seek encounters with Him. Outreach to Richmond and Henrico communities through food, clothing, hygiene kits, and Monthly Miracle Runs." />
        <meta property="og:image" content="/images/header-logo.png" />
        <meta property="og:url" content="https://tryhimandseeministries.org" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="tryHimandsee ministries" />
        <meta name="twitter:description" content="Random Blessings, Eternal Impact. Serving Richmond &amp; Henrico in the love of Christ." />
        <meta name="twitter:image" content="/images/header-logo.png" />

        <!-- PWA — installable to home screen -->
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" type="image/png" href="/images/header-logo.png" />
        <link rel="apple-touch-icon" href="/images/header-logo.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>tryHimandsee ministries</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
